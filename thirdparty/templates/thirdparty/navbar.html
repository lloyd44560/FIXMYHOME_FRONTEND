<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Home - FixMyHome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/heroicons@2.0.16/dist/heroicons.min.js"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/kolektif" rel="stylesheet">

  <style>
    body {
      font-family: 'Lexend', sans-serif;
    }

    /* Brand styling */
    .brand-font {
      font-family: 'Kolektif', sans-serif;
      color: #293272;
    }

    /* Hide top navbar on mobile */
    @media (max-width: 768px) {
      .top-navbar {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-gray-50">

  <!-- TOP NAVBAR (Hidden on mobile) -->
  <nav class="top-navbar flex justify-between items-center px-8 py-4 bg-white shadow-md sticky top-0 z-50">
    <!-- Logo -->
    <h1 class="text-3xl font-bold text-blue-600 flex items-center space-x-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 9.75L12 4.5l9 5.25v9a2.25 2.25 0 01-2.25 2.25h-3.75V15h-4.5v6H5.25A2.25 2.25 0 013 18.75v-9z" />
      </svg>
      <span>FixMyHouse</span>
    </h1>

    <!-- Hamburger Button -->
    <button id="menu-btn" class="block md:hidden focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-700" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Nav Links -->
    <div id="menu"
      class="hidden md:flex flex-col md:flex-row md:items-center absolute md:static top-16 left-0 w-full md:w-auto bg-white md:bg-transparent p-4 md:p-0 shadow md:shadow-none z-50 space-y-4 md:space-y-0 md:space-x-8">

      <!-- Home -->
      <a href="/welcome/" class="flex items-center text-blue-600 font-semibold transition space-x-2">
        <i class="bi bi-house-door-fill text-xl"></i>
        <span>Home</span>
      </a>

      <!-- Login -->
      <a href="/" class="flex items-center text-gray-700 hover:text-blue-600 transition space-x-2">
        <i class="bi bi-box-arrow-in-right text-xl"></i>
        <span>Login</span>
      </a>

      <!-- Register -->
      <a href="/register/" class="flex items-center text-gray-700 hover:text-blue-600 transition space-x-2">
        <i class="bi bi-person-plus text-xl"></i>
        <span>Register</span>
      </a>

      <!-- Contact Us -->
      <a href="" class="flex items-center text-gray-700 hover:text-blue-600 transition space-x-2">
        <i class="bi bi-telephone text-xl"></i>
        <span>Contact Us</span>
      </a>

      <!-- About Us -->
      <a href="" class="flex items-center text-gray-700 hover:text-blue-600 transition space-x-2">
        <i class="bi bi-info-circle text-xl"></i>
        <span>About Us</span>
      </a>

    </div>
  </nav>


  <!-- BOTTOM NAVBAR (Mobile Only) -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t shadow-md md:hidden">
    <div class="flex justify-around py-2">

      <!-- Home (Active) -->
      <a href="/welcome/" class="flex flex-col items-center text-blue-600">
        <i class="bi bi-house-door-fill text-2xl mb-1"></i>
        <span class="text-xs font-semibold">Home</span>
      </a>

      <!-- Messages -->
      <a href="#" class="flex flex-col items-center text-gray-500">
        <i class="bi bi-envelope text-2xl mb-1"></i>
        <span class="text-xs">Messages</span>
      </a>

      <!-- Settings -->
      <a href="#" class="flex flex-col items-center text-gray-500">
        <i class="bi bi-gear text-2xl mb-1"></i>
        <span class="text-xs">Settings</span>
      </a>

      <!-- Account -->
      <a href="#" class="flex flex-col items-center text-gray-500">
        <i class="bi bi-person-circle text-2xl mb-1"></i>
        <span class="text-xs">Account</span>
      </a>

    </div>
  </div>


  <!-- Script for mobile hamburger -->
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');

    menuBtn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  </script>

</body>
</html>
